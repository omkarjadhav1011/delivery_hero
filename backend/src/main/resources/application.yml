# Settings shared by every profile (LLD section 5.13). Profiles: dev, test, e2e and prod (Setup Guide section 8.2).
# Environment variables are mapped explicitly, because relaxed binding would put DH_ADMIN_PASSWORD_HASH under a
# different key (CLAUDE.md).
spring:
  application:
    name: delivery-hero
  config:
    import: classpath:scoring.yml
  datasource:
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only validates it (DEC-157)
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  # Nginx is the only proxy and sets the client's real address (document 16, section 8.4)
  forward-headers-strategy: native
  servlet:
    session:
      # A fixed 12 hours from login, which AdminSession enforces; this idle timeout is the backstop (DEC-97)
      timeout: 12h
      cookie:
        name: DH_SESSION
        http-only: true
        secure: true
        same-site: strict

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      # Only {"status": "UP"} or {"status": "DOWN"}, with no further detail (document 11, section 7.10)
      probes:
        enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  structured:
    format:
      console: ecs
  level:
    # At DEBUG, Spring's STOMP handling logs frames with their headers, player tokens and projector keys among them,
    # so these stay at INFO whatever else is turned up (DEC-104)
    org.springframework.web.socket.messaging: INFO
    org.springframework.messaging.simp: INFO
    # It logs every refused frame at ERROR with the WebSocket session ID; StompAuthInterceptor logs refusals without
    # IDs instead (DEC-104)
    org.springframework.web.socket.messaging.StompSubProtocolHandler: "OFF"

dh:
  admin:
    password-hash: ${DH_ADMIN_PASSWORD_HASH:}
  public-base-url: ${DH_PUBLIC_BASE_URL:}
  # Game timings and limits: GameProperties holds the defaults of LLD section 5.13
