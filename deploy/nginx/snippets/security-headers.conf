# Security headers for every response (NFR-19, NFR-20). Locations must not use add_header,
# or these would stop applying there; use expires for caching instead.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Written by the frontend build with the inline-script hashes (LLD section 6.6, DEC-135)
include /etc/nginx/snippets/csp.conf;

# NFR-13: enable in production once the certificate setup is proven (check OPS-06)
