# Nginx is the only proxy, so it overwrites X-Forwarded-For with the real client address:
# a client can't spoof it, and the backend's rate limits see real addresses (NFR-17)
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
