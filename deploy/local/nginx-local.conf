# Local stack and CI end-to-end site (document 18): plain HTTP on localhost, with production's
# headers and routes. Chrome treats http://localhost as secure, so the Secure admin cookie works.
server {
    listen 80 default_server;
    server_name _;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/routes.conf;
}
