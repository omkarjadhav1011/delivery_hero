# Live-reload development (document 18, section 7). The backend (port 8081) and the Next.js dev
# server (port 3000) run on this computer; this proxy keeps them on one origin,
# http://localhost:8080, because the API expects no cross-origin requests.
server {
    listen 80 default_server;
    server_name _;

    location = /health {
        proxy_pass http://host.docker.internal:8081/actuator/health;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /api/ops/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://host.docker.internal:8081;
        include /etc/nginx/snippets/proxy.conf;
    }

    location = /ws {
        proxy_pass http://host.docker.internal:8081;
        include /etc/nginx/snippets/proxy.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }

    # Pages, assets and hot-reload updates come from the Next.js dev server
    location / {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
}
